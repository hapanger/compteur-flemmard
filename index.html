<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flemmard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Compteur flemmard</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--soft:#fbfbf8;--ink:#191b1f;--muted:#68707a;--line:#d9dde3;--accent:#2563eb;--danger:#b42318;--gold:#b7791f;--blue:#eaf1ff;--red:#f8e3df;--green:#e7f7ef;--shadow:0 12px 30px rgba(31,41,55,.1)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,input,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-weight:800;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:0 12px;font-size:16px}input:focus,select:focus{outline:3px solid rgba(37,99,235,.14);border-color:var(--accent)}.app{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 36px}header{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:16px;padding:20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,var(--soft));box-shadow:var(--shadow)}h1{margin:0;font-size:clamp(1.1rem,2.5vw,2.2rem);line-height:1;font-weight:900}.subtitle{margin:8px 0 0;color:var(--muted);font-size:1rem}.header-actions,.button-row{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.panel-inner{padding:16px}.panel h2{margin:0 0 12px;font-size:1.05rem}.field-grid{display:grid;gap:8px}.player-row{display:grid;grid-template-columns:1fr 44px;gap:8px}.contract-row,.contract-head{display:grid;grid-template-columns:minmax(120px,1fr) 138px 44px;gap:8px;align-items:center}.contract-head{color:var(--muted);font-size:.75rem;font-weight:900;text-transform:uppercase}.section-gap{margin-top:20px}.muted{color:var(--muted);font-size:.9rem;line-height:1.35}.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.total-tile{min-height:96px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,var(--soft));display:grid;align-content:space-between}.total-tile.leader{border-color:rgba(183,121,31,.5);background:linear-gradient(180deg,#fff9e8,#fff)}.name{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-weight:900;overflow-wrap:anywhere}.score{font-size:2rem;font-weight:900;line-height:1}.round-form{display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;align-items:end;margin-bottom:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}label{display:grid;gap:6px;color:var(--muted);font-size:.8rem;font-weight:900;text-transform:uppercase}.round-scores{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.status{grid-column:1/-1;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-weight:800;line-height:1.25}.status.ok{background:var(--blue);border-color:var(--accent);color:#1d4ed8}.status.bad{background:var(--red);border-color:rgba(180,35,24,.35);color:var(--danger)}.recap{margin-bottom:16px}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;overflow-wrap:anywhere}th{background:var(--soft);color:var(--muted);font-size:.78rem;text-transform:uppercase}tr:last-child td{border-bottom:0}.recap table{min-width:680px}.dot{width:12px;height:12px;border-radius:99px;border:1px solid var(--line);background:#fff;display:inline-block;margin-right:8px}.dot.done{background:var(--accent);border-color:var(--accent)}.negative{color:var(--danger);background:var(--red);border-radius:7px;padding:2px 7px;font-weight:900}.positive{color:#166534;background:var(--green);border-radius:7px;padding:2px 7px;font-weight:900}.empty{min-height:120px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;padding:18px;background:#fff}.file-input{display:none}.remaining{color:var(--muted);font-size:.86rem;line-height:1.35}
    @media(max-width:900px){header,.layout{grid-template-columns:1fr}.layout>.panel:first-child{order:2}.layout>.panel:last-child{order:1}.totals,.round-scores{grid-template-columns:repeat(2,minmax(0,1fr))}.round-form{grid-template-columns:1fr}.header-actions{justify-content:flex-start}}
    @media(max-width:560px){.app{width:100%;padding:10px 10px 28px}header{grid-template-columns:1fr;gap:12px;margin-bottom:10px;padding:14px}h1{font-size:1.45rem}.subtitle{font-size:.92rem}.header-actions,.button-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.layout{gap:10px}.panel-inner{padding:12px}.totals{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}.total-tile{min-height:86px;padding:12px}.score{font-size:1.8rem}.round-form{position:sticky;top:8px;z-index:3;margin:0 -4px 14px;padding:12px;box-shadow:var(--shadow)}.round-scores{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.contract-row,.contract-head{grid-template-columns:1fr 118px 44px}.table-scroll{overflow:visible;border:0}table,.recap table,thead,tbody,tr,th,td{display:block;width:100%;min-width:0}thead{display:none}table{background:transparent}tr{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 8px 18px rgba(31,41,55,.05);overflow:hidden}td{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;text-align:right}td::before{content:attr(data-label);color:var(--muted);font-size:.78rem;font-weight:900;text-align:left;text-transform:uppercase}.dot{margin-right:6px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>Compteur flemmard</h1><p class="subtitle">Pour compter facilement les points après quelques verres</p></div><div class="header-actions"><button id="exportJson">Exporter</button><button id="exportCsv">CSV</button><button id="importButton">Importer</button><button id="resetGame" class="danger">Réinitialiser</button><input id="importFile" class="file-input" type="file" accept="application/json"></div></header>
    <section class="layout">
      <aside class="panel"><div class="panel-inner"><h2>Joueurs</h2><div id="players" class="field-grid"></div><div class="button-row section-gap"><button id="addPlayer">Ajouter</button><button id="fourPlayers">4 joueurs</button></div><div class="section-gap"><h2>Contrats</h2><div id="contracts" class="field-grid"></div><div class="button-row section-gap"><button id="addContract">Ajouter</button><button id="resetContracts">Contrats par défaut</button></div><p class="muted">Le total attendu sert à vérifier qu’une manche est complète. Laisse vide pour ne pas contrôler ce contrat.</p></div></div></aside>
      <section class="panel"><div class="panel-inner"><div id="totals" class="totals"></div><form id="roundForm" class="round-form"><label>Contrat<select id="contractSelect"></select></label><label>Donneur<select id="dealerSelect"></select></label><button class="primary" type="submit">Ajouter la manche</button><div id="roundScores" class="round-scores"></div><div id="roundStatus" class="status"></div></form><div id="contractRecap" class="recap"></div><div id="history"></div></div></section>
    </section>
  </main>
  <script>
    const STORAGE_KEY="barbu-score-v3";
    const defaultContracts=[{id:"pas-de-plis",name:"Pas de plis",expectedTotal:"80"},{id:"pas-de-coeurs",name:"Pas de coeurs",expectedTotal:"80"},{id:"pas-de-dames",name:"Pas de dames",expectedTotal:"100"},{id:"pas-le-barbu",name:"Pas le Barbu",expectedTotal:"100"},{id:"pas-le-dernier-pli",name:"Pas le dernier pli",expectedTotal:"100"},{id:"reussite",name:"Reussite",expectedTotal:"-100 // -50"},{id:"marmelade",name:"Marmelade",expectedTotal:"-460"},{id:"contre-marmelade",name:"Contre-marmelade",expectedTotal:"460"}];
    const base={players:["Nicolas","Joueur 2","Joueur 3","Joueur 4"],contracts:structuredClone(defaultContracts),rounds:[]};
    let state=load();
    const $=s=>document.querySelector(s), playersEl=$("#players"), contractsEl=$("#contracts"), totalsEl=$("#totals"), contractSelect=$("#contractSelect"), dealerSelect=$("#dealerSelect"), roundScoresEl=$("#roundScores"), roundStatusEl=$("#roundStatus"), recapEl=$("#contractRecap"), historyEl=$("#history");
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));return normalize(saved||base)}catch{return normalize(base)}}
    function normalize(s){return{players:Array.isArray(s.players)&&s.players.length?s.players:structuredClone(base.players),contracts:Array.isArray(s.contracts)&&s.contracts.length?s.contracts.map((c,i)=>typeof c==="string"?{id:slug(c,i),name:c,expectedTotal:defTotal(c)}:{id:c.id||slug(c.name||"Contrat",i),name:c.name||"Contrat",expectedTotal:c.expectedTotal==null?"":String(c.expectedTotal)}):structuredClone(defaultContracts),rounds:Array.isArray(s.rounds)?s.rounds.map(r=>({contractId:r.contractId||"",contractName:r.contractName||r.contract||"Contrat",dealer:r.dealer||"",scores:Array.isArray(r.scores)?r.scores.map(n=>Number(n||0)):[]})):[]}}
    function slug(name,i){return String(name).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+i}function defTotal(n){return (defaultContracts.find(c=>c.name===n)||{}).expectedTotal||""}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function render(){renderPlayers();renderContracts();renderSelectors();renderRoundScores();renderStatus();renderTotals();renderRecap();renderHistory();save()}
    function renderPlayers(){playersEl.innerHTML="";state.players.forEach((p,i)=>{const row=document.createElement("div");row.className="player-row";const input=document.createElement("input");input.value=p;input.placeholder=`Joueur ${i+1}`;input.oninput=()=>{state.players[i]=input.value.trim()||`Joueur ${i+1}`;render()};const del=document.createElement("button");del.textContent="X";del.className="danger";del.disabled=state.players.length<=2;del.onclick=()=>{state.players.splice(i,1);state.rounds=state.rounds.map(r=>({...r,scores:r.scores.slice(0,state.players.length)}));render()};row.append(input,del);playersEl.append(row)})}
    function renderContracts(){contractsEl.innerHTML='<div class="contract-head"><span>Contrat</span><span>Total</span><span></span></div>';state.contracts.forEach((c,i)=>{const row=document.createElement("div");row.className="contract-row";const name=document.createElement("input");name.value=c.name;name.oninput=()=>{state.contracts[i].name=name.value.trim()||"Contrat";renderSelectors();renderStatus();renderRecap();renderHistory();save()};const total=document.createElement("input");total.type="text";total.value=c.expectedTotal;total.placeholder="80 ou -100 // -50";total.oninput=()=>{state.contracts[i].expectedTotal=total.value.trim();renderStatus();save()};const del=document.createElement("button");del.textContent="X";del.className="danger";del.disabled=state.contracts.length<=1;del.onclick=()=>{state.contracts.splice(i,1);render()};row.append(name,total,del);contractsEl.append(row)})}
    function renderSelectors(){const cid=contractSelect.value,d=dealerSelect.value;contractSelect.innerHTML=state.contracts.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");if(state.contracts.some(c=>c.id===cid))contractSelect.value=cid;dealerSelect.innerHTML=state.players.map(p=>`<option>${esc(p)}</option>`).join("");if(state.players.includes(d))dealerSelect.value=d}
    function renderRoundScores(){roundScoresEl.innerHTML="";state.players.forEach((p,i)=>{const label=document.createElement("label");label.textContent=p;const input=document.createElement("input");input.type="number";input.step="1";input.value="0";input.oninput=renderStatus;label.append(input);roundScoresEl.append(label)})}
    function selected(){return state.contracts.find(c=>c.id===contractSelect.value)||state.contracts[0]}function scores(){return [...roundScoresEl.querySelectorAll("input")].map(i=>Number(i.value||0))}function expected(v){if(v==="")return null;const nums=String(v).match(/[+-]?\d+(?:[.,]\d+)?/g);return nums?nums.reduce((s,n)=>s+Number(n.replace(",",".")),0):NaN}function expectedLabel(v){const n=expected(v);return String(v).trim()===String(n)?String(n):`${n} (${v})`}
    function renderStatus(){const c=selected();if(!c){roundStatusEl.textContent="Ajoute au moins un contrat.";roundStatusEl.className="status bad";return}const sum=scores().reduce((a,b)=>a+b,0), exp=expected(c.expectedTotal);if(exp===null){roundStatusEl.textContent=`Total saisi : ${sum}. Aucun contrôle configuré.`;roundStatusEl.className="status";return}if(Number.isNaN(exp)){roundStatusEl.textContent="Le total attendu n’est pas lisible.";roundStatusEl.className="status bad";return}const diff=exp-sum;if(diff===0){roundStatusEl.textContent=`Manche complète : total ${sum} / ${expectedLabel(c.expectedTotal)}.`;roundStatusEl.className="status ok"}else{roundStatusEl.textContent=`Manche incomplète : total ${sum} / ${expectedLabel(c.expectedTotal)}, ${diff>0?`il manque ${diff}`:`il y a ${Math.abs(diff)} point(s) en trop`}.`;roundStatusEl.className="status bad"}}
    function roundOk(){const c=selected(), exp=c?expected(c.expectedTotal):null;if(exp===null)return true;if(Number.isNaN(exp))return false;return scores().reduce((a,b)=>a+b,0)===exp}function totals(){return state.players.map((_,i)=>state.rounds.reduce((s,r)=>s+Number(r.scores[i]||0),0))}
    function renderTotals(){const t=totals(), best=Math.min(...t), worst=Math.max(...t);totalsEl.innerHTML=state.players.map((p,i)=>`<div class="total-tile ${t[i]===best?"leader":""}"><div class="name"><span>${esc(p)}</span><span>${t[i]===best?"👑":""}${t[i]===worst&&worst!==best?"💩":""}</span></div><div class="score">${t[i]}</div></div>`).join("")}
    function contractName(r){return (state.contracts.find(c=>c.id===r.contractId)||{}).name||r.contractName||"Contrat"}function done(p,c){return state.rounds.some(r=>(r.contractId?r.contractId===c.id:contractName(r)===c.name)&&r.dealer===p)}
    function renderRecap(){const heads=state.players.map(p=>`<th>${esc(p)}</th>`).join(""), rows=state.contracts.map(c=>`<tr><td data-label="Contrat">${esc(c.name)}</td>${state.players.map(p=>`<td data-label="${esc(p)}"><span><span class="dot ${done(p,c)?"done":""}"></span>${done(p,c)?"Fait":"Restant"}</span></td>`).join("")}</tr>`).join(""), rest=state.players.map(p=>`${esc(p)} : ${state.contracts.filter(c=>!done(p,c)).length}`).join(" · ");recapEl.innerHTML=`<h2>Contrats par joueur</h2><div class="table-scroll"><table><thead><tr><th>Contrat</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div><p class="remaining">Restants : ${rest}</p>`}
    function renderHistory(){if(!state.rounds.length){historyEl.innerHTML='<h2>Historique</h2><div class="empty">Aucune manche pour l’instant.</div>';return}const heads=state.players.map(p=>`<th>${esc(p)}</th>`).join(""), rows=state.rounds.map((r,i)=>`<tr><td data-label="Manche">${i+1}</td><td data-label="Contrat">${esc(contractName(r))}</td><td data-label="Donneur">${esc(r.dealer)}</td>${state.players.map((p,j)=>{const n=Number(r.scores[j]||0), cls=n<0?"negative":n>0?"positive":"";return `<td data-label="${esc(p)}"><span class="${cls}">${n}</span></td>`}).join("")}<td data-label="Action"><button class="danger" data-del="${i}">X</button></td></tr>`).join("");historyEl.innerHTML=`<h2>Historique</h2><div class="table-scroll"><table><thead><tr><th>#</th><th>Contrat</th><th>Donneur</th>${heads}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;historyEl.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.rounds.splice(Number(b.dataset.del),1);render()})}
    function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}function csv(){const rows=[["Manche","Contrat","Donneur",...state.players],...state.rounds.map((r,i)=>[i+1,contractName(r),r.dealer,...state.players.map((_,j)=>r.scores[j]||0)])];return rows.map(r=>r.map(c=>`"${String(c).replaceAll('"','""')}"`).join(",")).join("\n")}
    $("#roundForm").onsubmit=e=>{e.preventDefault();if(!roundOk()){renderStatus();alert("La manche n’est pas complète selon le total attendu du contrat.");return}const c=selected();state.rounds.push({contractId:c.id,contractName:c.name,dealer:dealerSelect.value,scores:scores()});renderRoundScores();renderStatus();renderTotals();renderRecap();renderHistory();save()};contractSelect.onchange=renderStatus;dealerSelect.onchange=renderRecap;$("#addPlayer").onclick=()=>{state.players.push(`Joueur ${state.players.length+1}`);state.rounds=state.rounds.map(r=>({...r,scores:[...r.scores,0]}));render()};$("#fourPlayers").onclick=()=>{state.players=structuredClone(base.players);state.rounds=[];render()};$("#addContract").onclick=()=>{state.contracts.push({id:slug("Nouveau contrat",Date.now()),name:"Nouveau contrat",expectedTotal:""});render()};$("#resetContracts").onclick=()=>{state.contracts=structuredClone(defaultContracts);render()};$("#resetGame").onclick=()=>{if(confirm("Effacer toute la partie en cours ?")){state=structuredClone(base);render()}};$("#exportJson").onclick=()=>download("partie-barbu.json",JSON.stringify(state,null,2),"application/json");$("#exportCsv").onclick=()=>download("scores-barbu.csv",csv(),"text/csv;charset=utf-8");$("#importButton").onclick=()=>$("#importFile").click();$("#importFile").onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=normalize(JSON.parse(reader.result));render()}catch{alert("Impossible d’importer ce fichier.")}finally{e.target.value=""}};reader.readAsText(file)};
    if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});render();
  </script>
</body>
</html>
